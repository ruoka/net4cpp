name: C/C++ CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Only cancel superseded PR runs. Never cancel master/main mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI environments frequently lack privileges / networking setup needed for integration tests.
  # net defaults to running network tests locally; in CI we disable them for determinism.
  NET_DISABLE_NETWORK_TESTS: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        config: [ debug, release ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Show compiler version
        run: clang++ --version

      - name: Build project (${{ matrix.config }})
        run: ./tools/CB.sh ${{ matrix.config }} build

      # Scope to net tests only — full suite includes nested deps/tester
      # [.jsonl-probe] intentional-failure probes (hidden unless selected).
      # --jobs forwards to test_runner for parallel top-level cases; --junit=
      # writes an additive xUnit report beside JSONL (see ruoka/tester CI).
      - name: Run tests (${{ matrix.config }})
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "Running [net] tests with --jobs=${jobs}"
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs="${jobs}" \
            --junit="test_results_${{ matrix.config }}.xml" \
            --tags='\[net\]' > "test_results_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Tests failed (summary.passed=$passed)"
            tail -20 "test_results_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Tests passed (jobs=${jobs})"

      - name: Validate JSONL output
        run: |
          set -euo pipefail
          f="test_results_${{ matrix.config }}.jsonl"
          if [ ! -f "$f" ]; then
            echo "ERROR: JSONL output file not found!"
            exit 1
          fi
          echo "JSONL lines ($f): $(wc -l < "$f")"
          if ! tail -1 "$f" | jq -e '.type == "eof"' >/dev/null; then
            echo "✗ EOF marker missing in $f — the stream was truncated"
            tail -5 "$f"
            exit 1
          fi
          echo "✓ EOF marker found"

      # show=all writes the test table into the job Summary on green runs too
      # (default show=fail leaves only a tiny SVG badge when everything passes).
      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: test_results_${{ matrix.config }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.config }}
          path: |
            test_results_${{ matrix.config }}.jsonl
            test_results_${{ matrix.config }}.xml

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM + analysis tools
        uses: ./.github/actions/setup-llvm
        with:
          packages: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq clang-tools-21 clang-tidy-21 cppcheck libssl-dev"

      - name: Run clang-tidy (non-blocking)
        run: |
          set -euo pipefail
          find net -name "*.c++m" -o -name "*.c++" | head -20 | while read -r f; do
            echo "Analyzing $f"
            clang-tidy-21 "$f" -- -std=c++23 -I/usr/lib/llvm-21/include/c++/v1 2>/dev/null || true
          done

      - name: Run cppcheck (non-blocking)
        run: |
          cppcheck --enable=all --std=c++23 --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            net/ tools/ 2>/dev/null || true

  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check submodule status + clean tree
        run: |
          set -euo pipefail
          echo "=== Submodule Status ==="
          git submodule status || echo "No submodules"
          echo ""
          echo "=== Checking for uncommitted changes ==="
          if git status --porcelain | grep -q .; then
            echo "✗ Uncommitted changes found"
            git status --porcelain
            exit 1
          else
            echo "✓ Repo is clean"
          fi
